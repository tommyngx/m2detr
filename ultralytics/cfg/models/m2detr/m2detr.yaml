# M2DETR default: compact timm ResNet-50 backbone + RT-DETR-style multitask decoder.

nc: 1
cls_nc: 2
scales:
  n: [1.00, 1.00, 1024]

backbone:
  # args: [ignored_out_channels, timm_model, pretrained, out_indices, in_chans, freeze]
  - [-1, 1, M2TimmBackbone, [2048, resnet50, False, [2, 3, 4], 3, False]] # 0: P3/P4/P5 list
  - [0, 1, Index, [512, 0]] # 1-P3/8
  - [0, 1, Index, [1024, 1]] # 2-P4/16
  - [0, 1, Index, [2048, 2]] # 3-P5/32

head:
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [1, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [[15, 18, 21], 1, M2RTDETRDecoder, [nc, cls_nc, 256, 100, 4, 8, 3, 1024]]
