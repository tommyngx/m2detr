# M2DETR with timm DINOv2 ViT-S/14 backbone plus adapter/neck.
# DINOv2 ViT returns same-stride token maps, so this config builds a pseudo P3/P4/P5 pyramid before the RT-DETR head.

nc: 1
cls_nc: 2
scales:
  n: [1.00, 1.00, 1024]

backbone:
  # args: [ignored_out_channels, timm_model, pretrained, out_indices, in_chans, freeze, model_kwargs, pad_divisor]
  - [-1, 1, M2TimmBackbone, [384, vit_small_patch14_reg4_dinov2.lvd142m, False, [0, 1, 2], 3, False, {dynamic_img_size: True}, 14]]
  - [0, 1, Index, [384, 0]]
  - [0, 1, Index, [384, 1]]
  - [0, 1, Index, [384, 2]]

head:
  # Adapter: project DINOv2 token maps and synthesize a P3/P4/P5-like pyramid.
  - [1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 4 pseudo-P3
  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 5
  - [-1, 1, Conv, [256, 3, 2]] # 6 pseudo-P4
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 7
  - [-1, 1, Conv, [256, 3, 2]] # 8
  - [-1, 1, Conv, [256, 3, 2]] # 9 pseudo-P5

  # RT-DETR-style FPN/PAN neck and multitask decoder.
  - [9, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [[21, 24, 27], 1, M2RTDETRDecoder, [nc, cls_nc, 256, 100, 4, 8, 3, 1024]]
